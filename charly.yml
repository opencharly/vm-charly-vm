charly-vm:
    candy:
        description: |-
            Concept candy owning the charly-vm kind-authoring skills (vm schema + the bootc VM catalog). Owns its family's `skill:` kind entities (sibling nodes in this file) — the
            the plugins→candies migration; candy/plugin-marketplace regenerates the marketplace
            corpus (the standalone opencharly/marketplace repo) from them.
        plan:
            - run: this documentation-only candy ships no install content (it carries the family's skill/hook/marketplace entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: the vm concept candy's skill entities are present and generated into the marketplace's vm/skills
              id: charly-vm-present
              context:
                - build
              command: "true"
arch-cloud-vm-skill:
    skill:
        name: arch-cloud-vm
        family: vm
        owner: charly-vm
cachyos-bootstrap-vm-skill:
    skill:
        name: cachyos-bootstrap-vm
        family: vm
        owner: charly-vm
        triggers:
            - "CachyOS images / `cachyos*` / `charly-cachyos` workstation profile / `box/cachyos` submodule"
debian-debootstrap-vm-skill:
    skill:
        name: debian-debootstrap-vm
        family: vm
        owner: charly-vm
        triggers:
            - "Debian images / `debian*` / `box/debian` submodule"
ubuntu-debootstrap-vm-skill:
    skill:
        name: ubuntu-debootstrap-vm
        family: vm
        owner: charly-vm
        triggers:
            - "Ubuntu images / `ubuntu*` / `box/ubuntu` submodule"
vm-skill:
    skill:
        name: vm
        family: vm
        owner: charly-vm
        triggers:
            - "`charly update` / `charly vm *` / VM entities in `vm.yml` or `vm:`"
            - "Managed `~/.config/charly/ssh_config` fragment / `charly vm create` writes Host stanza"
vms-catalog-skill:
    skill:
        name: vms-catalog
        family: vm
        owner: charly-vm
